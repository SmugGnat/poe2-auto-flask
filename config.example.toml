[general]
# Auto-flask is always disabled in towns. Hideouts are disabled by default; set this to true to
# allow auto-flask use in hideouts.
enable_in_hideout = false

[health]
enabled = true
threshold_percent = 60.0

[mana]
enabled = true
threshold_percent = 30.0

# PoE1 uses the same Life/Mana percentage thresholds above; percentages are based on the
# unreserved pool. Quicksilver and other supported utility-flask types are opt-in.
# No per-slot keys are needed: both games read their own production_Config.ini.
# Unknown utility bases and ordinary hybrid flasks remain manual-only in this milestone.
[poe1]
# 0 = use Quicksilver as before. 750 = require 750 ms of continuously
# observed Run animation before using Quicksilver; does not restrict Life/Mana.
# Supported range: 0 (off) or 100..5000. Verify Movement in --debug first.
quicksilver_min_run_ms = 0

[poe1.utility]
# All standard PoE1 utility bases are recognized; enable only equipped types needed.
quicksilver = false
granite = false
quartz = false
diamond = false
jade = false
silver = false
basalt = false
stibnite = false
sulphur = false
ruby = false
sapphire = false
topaz = false
amethyst = false
bismuth = false
aquamarine = false
gold = false
corundum = false
iron = false

# Optional PoE1 utility proximity rules. A table enables gating for that flask
# type; without a table, the existing effect-maintenance behavior is unchanged.
# Example: once Granite is enabled above, require >=1 monster of Normal or
# higher rarity (includes Magic/Rare/Unique) within 60 grid units.
# [poe1.nearby.granite]
# minimum_rarity = "normal" # "magic", "rare" or "unique" also supported
# minimum_count = 1
# radius = 60
# enabled = true # optional; use false to temporarily disable the condition
#
# A Rare minimum also matches Unique bosses; boss intro phases may be counted
# before the enemy is damageable. An unavailable census blocks only gated
# utility flasks, not emergency Life/Mana recovery.

# Unique flasks are opt-in. Writhing Jar is identified from its worm-spawning
# equipped modifier, not by hybrid-flask base type. It fires as soon as its
# verified effective charge cost is available (existing safety gates apply).
# It is NOT used as an ordinary Life/Mana hybrid flask.
[poe1.unique]
writhing_jar = false

# Optional nearby condition for Writhing Jar (disabled by omission).
# Keep this separate from [poe1.unique]: TOML keys cannot be both Boolean
# toggles and nested tables. The nearby census reuses the existing 750 ms cache.
# [poe1.unique_conditions.writhing_jar.nearby]
# enabled = true
# radius = 60
# minimum_count = 1
# minimum_rarity = "normal"

# PoE1 defensive skill presets are separately configurable. Skills are
# disabled by default and share the existing 100 ms loop with flask rules.
# Each skill key must match its in-game binding. Only A-Z, 0-9,
# F1-F10 and F12 are supported; F11 is reserved. Enabled skills
# must use different keys.
# The skill rule cannot run in town, or in hideouts unless permitted above.
[poe1.skills.molten_shell]
enabled = false
threshold_percent = 95
key = "Q"

# Blood Rage maintains its duration through kills, so don't repeatedly
# cast it while its buff is active. Requiring nearby monsters by default
# avoids starting the self-damage effect while standing alone.
# Proximity reuses the existing throttled 750ms PoE1 monster census.
[poe1.skills.blood_rage]
enabled = false
key = "T"
min_life_percent = 80
require_nearby_monsters = true
nearby_radius = 60
nearby_minimum_count = 1

# Existing PoE2 operation is unchanged: two slots, F11, 100 ms polling.
