name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check MSRV
        run: cargo check --locked --target x86_64-pc-windows-msvc

  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/poe2-auto-flask.exe dist/
          Copy-Item config.example.toml dist/
          Copy-Item LICENSE dist/
          Copy-Item ACKNOWLEDGEMENTS.md dist/
          & ./scripts/collect-third-party-licenses.ps1 `
            -OutputDir "$env:RUNNER_TEMP/poe2-auto-flask-third-party-licenses" `
            -NoticePath "dist/THIRD_PARTY_NOTICES.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poe2-auto-flask-windows-x64
          path: dist/
          if-no-files-found: error
