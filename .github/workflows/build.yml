name: Build

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app-ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "config.example.toml"
      - "linux-launcher/**"
      - "packaging/linux/**"
      - "packaging/licenses/**"
      - "scripts/**"
      - "LICENSE"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "!**/*.md"
      - "!**/*.markdown"
      - "!**/*.rst"
      - "!**/*.adoc"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app-ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "config.example.toml"
      - "linux-launcher/**"
      - "packaging/linux/**"
      - "packaging/licenses/**"
      - "scripts/**"
      - "LICENSE"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "!**/*.md"
      - "!**/*.markdown"
      - "!**/*.rst"
      - "!**/*.adoc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.changes.outputs.msrv }}
      windows: ${{ steps.changes.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      appimage: ${{ steps.changes.outputs.appimage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected components
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "msrv=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "linux=true" >> "$GITHUB_OUTPUT"
            echo "appimage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$BEFORE"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")
          fi

          mapfile -t files < <(git diff --name-only "$base" "$head")
          printf 'Changed files:\n'
          printf '  %s\n' "${files[@]}"

          windows_changed=false
          linux_changed=false
          appimage=false

          for file in "${files[@]}"; do
            case "$file" in
              *.md|*.markdown|*.rst|*.adoc)
                continue
                ;;
              src/*|app-ui/*|Cargo.toml|Cargo.lock|config.example.toml)
                windows_changed=true
                appimage=true
                ;;
              rust-toolchain.toml)
                windows_changed=true
                linux_changed=true
                appimage=true
                ;;
              linux-launcher/*)
                linux_changed=true
                appimage=true
                ;;
              packaging/linux/*|packaging/licenses/*|scripts/*|LICENSE)
                appimage=true
                ;;
              .github/workflows/build.yml|.github/workflows/release.yml)
                windows_changed=true
                linux_changed=true
                appimage=true
                ;;
            esac
          done

          windows="$windows_changed"
          linux="$linux_changed"

          # AppImage assembly consumes both build artifacts, so packaging or
          # launcher changes need fresh Windows and Linux artifacts in this run.
          if [[ "$appimage" == "true" ]]; then
            windows=true
            linux=true
          fi

          echo "msrv=$windows_changed" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

          printf 'Jobs: msrv=%s windows=%s linux=%s appimage=%s\n' \
            "$windows_changed" "$windows" "$linux" "$appimage"

  msrv:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.msrv == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Windows Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app-ui -> target

      - name: Check pinned Rust version
        run: rustc --version

      - name: Check backend
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Check UI
        run: cargo check --locked --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc

  windows-x64:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Windows Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app-ui -> target

      - name: Backend formatting
        run: cargo fmt --all -- --check

      - name: UI formatting
        run: cargo fmt --manifest-path app-ui/Cargo.toml -- --check

      - name: Backend Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: UI Clippy
        run: cargo clippy --locked --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Backend tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: UI tests
        run: cargo test --locked --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package Windows application
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: poe2-auto-flask-windows-x64
          path: dist/
          if-no-files-found: error

  linux-launcher:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.linux == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Cache launcher Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "linux-launcher -> target"

      - name: Check formatting
        working-directory: linux-launcher
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: linux-launcher
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: linux-launcher
        run: cargo test --locked

      - name: Test desktop launch routing
        run: python3 scripts/test-app-run.py

      - name: Build release
        working-directory: linux-launcher
        run: cargo build --locked --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp linux-launcher/target/release/poe2-auto-flask-linux-launcher dist/
          cp LICENSE dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: poe2-auto-flask-linux-launcher
          path: dist/
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-latest
    needs: [changes, windows-x64, linux-launcher]
    if: needs.changes.outputs.appimage == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows application
        uses: actions/download-artifact@v8
        with:
          name: poe2-auto-flask-windows-x64
          path: windows-artifact

      - name: Download Linux launcher
        uses: actions/download-artifact@v8
        with:
          name: poe2-auto-flask-linux-launcher
          path: linux-artifact

      - name: Package AppImage
        run: |
          bash scripts/package-appimage.sh windows-artifact \
            linux-artifact/poe2-auto-flask-linux-launcher \
            dist/poe2-auto-flask-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: poe2-auto-flask-x86_64-appimage
          path: dist/poe2-auto-flask-x86_64.AppImage
          if-no-files-found: error
