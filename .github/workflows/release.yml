name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit contained in main."
          }

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Verify tag version matches Cargo.toml
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format; got '$tag'."
          }

          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'poe2-auto-flask' }
          if ($null -eq $package) {
            throw "Could not find poe2-auto-flask in Cargo metadata."
          }

          $tagVersion = $Matches.version
          if ($package.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $($package.version)."
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare release assets
        shell: pwsh
        run: |
          $source = 'target/x86_64-pc-windows-msvc/release/poe2-auto-flask.exe'
          $exe = 'poe2-auto-flask.exe'
          $checksum = 'poe2-auto-flask.exe.sha256'
          $notices = 'THIRD_PARTY_NOTICES.txt'

          Copy-Item $source $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  poe2-auto-flask.exe" | Set-Content -Encoding ascii $checksum

          & ./scripts/collect-third-party-licenses.ps1 `
            -OutputDir "$env:RUNNER_TEMP/poe2-auto-flask-third-party-licenses" `
            -NoticePath $notices

          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_REF_NAME"
          $notes = @(
            "Automated CI build from tag $env:GITHUB_REF_NAME."
            ""
            "Commit: $env:GITHUB_SHA"
            "Source: $sourceUrl"
            "License: GPL-3.0-only"
            ""
            "SHA-256 (poe2-auto-flask.exe):"
            ""
            '```text'
            $hash
            '```'
          )
          $notes | Set-Content -Encoding utf8 release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME poe2-auto-flask.exe poe2-auto-flask.exe.sha256 LICENSE ACKNOWLEDGEMENTS.md THIRD_PARTY_NOTICES.txt --verify-tag --title $env:GITHUB_REF_NAME --notes-file release-notes.md
