name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.6.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Verify release source and version
        shell: pwsh
        run: |
          git fetch origin main --tags

          $commit = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($commit -ne $main) {
              throw "Manual releases must build the current main commit."
            }

            $version = '${{ inputs.version }}'
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Manual release version must use MAJOR.MINOR.PATCH format; got '$version'."
            }
            $tag = "v$version"

            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($existingTag) {
              throw "Tag $tag already exists."
            }
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH format; got '$tag'."
            }
            $version = $Matches.version

            git merge-base --is-ancestor $commit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit contained in main."
            }
          }

          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'poe2-auto-flask' }
          if ($null -eq $package) {
            throw "Could not find poe2-auto-flask in Cargo metadata."
          }
          if ($package.version -ne $version) {
            throw "Release version $version does not match Cargo.toml version $($package.version)."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare release assets
        shell: pwsh
        run: |
          $source = 'target/x86_64-pc-windows-msvc/release/poe2-auto-flask.exe'
          $exe = 'poe2-auto-flask.exe'
          $checksum = 'poe2-auto-flask.exe.sha256'
          $notices = 'THIRD_PARTY_NOTICES.txt'

          Copy-Item $source $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  poe2-auto-flask.exe" | Set-Content -Encoding ascii $checksum

          & ./scripts/collect-third-party-licenses.ps1 `
            -OutputDir "$env:RUNNER_TEMP/poe2-auto-flask-third-party-licenses" `
            -NoticePath $notices

          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:RELEASE_TAG"
          $notes = @(
            "Automated CI build from tag $env:RELEASE_TAG."
            ""
            "Commit: $env:RELEASE_SHA"
            "Source: $sourceUrl"
            "License: GPL-3.0-only"
            ""
            "SHA-256 (poe2-auto-flask.exe):"
            ""
            '```text'
            $hash
            '```'
          )
          $notes | Set-Content -Encoding utf8 release-notes.md

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG $env:RELEASE_SHA -m $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tag $env:RELEASE_TAG."
          }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push tag $env:RELEASE_TAG."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG poe2-auto-flask.exe poe2-auto-flask.exe.sha256 LICENSE ACKNOWLEDGEMENTS.md THIRD_PARTY_NOTICES.txt --verify-tag --title $env:RELEASE_TAG --notes-file release-notes.md
