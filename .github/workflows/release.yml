name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.6.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Verify release source and version
        shell: pwsh
        run: |
          git fetch origin main --tags

          $main = (git rev-parse origin/main).Trim()

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Manual release version must use MAJOR.MINOR.PATCH format; got '$version'."
            }
            $tag = "v$version"

            git show-ref --tags --verify "refs/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $commit = (git rev-list -n 1 $tag).Trim()

              git merge-base --is-ancestor $commit origin/main
              if ($LASTEXITCODE -ne 0) {
                throw "Existing tag $tag is not contained in main."
              }

              git checkout --detach $commit
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to check out existing tag $tag."
              }
            } else {
              $commit = (git rev-parse HEAD).Trim()
              if ($commit -ne $main) {
                throw "New manual releases must build the current main commit."
              }
            }
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH format; got '$tag'."
            }
            $version = $Matches.version
            $commit = (git rev-parse HEAD).Trim()

            git merge-base --is-ancestor $commit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit contained in main."
            }
          }

          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'poe2-auto-flask' }
          if ($null -eq $package) {
            throw "Could not find poe2-auto-flask in Cargo metadata."
          }
          if ($package.version -ne $version) {
            throw "Release version $version does not match Cargo.toml version $($package.version)."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = 'target/x86_64-pc-windows-msvc/release/poe2-auto-flask.exe'
          $exe = 'poe2-auto-flask.exe'
          $licenses = 'LICENSES.txt'
          $thirdParty = Join-Path $env:RUNNER_TEMP 'THIRD_PARTY_NOTICES.txt'

          Copy-Item $source $exe

          & ./scripts/collect-third-party-licenses.ps1 `
            -OutputDir "$env:RUNNER_TEMP/poe2-auto-flask-third-party-licenses" `
            -NoticePath $thirdParty

          @(
            'PoE2 Auto Flask'
            'GPL-3.0-only and third-party dependency licenses'
            ''
            '=============================================================================='
            'PROJECT LICENSE'
            '=============================================================================='
            ''
          ) | Set-Content -LiteralPath $licenses -Encoding utf8
          Get-Content -LiteralPath LICENSE -Raw | Add-Content -LiteralPath $licenses -Encoding utf8
          @(
            ''
            '=============================================================================='
            'THIRD-PARTY DEPENDENCY LICENSES'
            '=============================================================================='
            ''
          ) | Add-Content -LiteralPath $licenses -Encoding utf8
          Get-Content -LiteralPath $thirdParty -Raw | Add-Content -LiteralPath $licenses -Encoding utf8

          $existingReleases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $previousRelease = $existingReleases |
            Where-Object { -not $_.draft -and $_.tag_name -ne $env:RELEASE_TAG } |
            Sort-Object published_at -Descending |
            Select-Object -First 1

          if ($null -eq $previousRelease) {
            @(
              'Initial public release.'
              ''
              '- Automatic Life and Mana flask use with configurable thresholds'
              '- Reads PoE2 flask bindings automatically'
              '- Supports Windows x64 and Linux through Steam Proton'
            ) | Set-Content -LiteralPath release-notes.md -Encoding utf8
          } else {
            $generated = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f "tag_name=$env:RELEASE_TAG" `
              -f "target_commitish=$env:RELEASE_SHA" `
              -f "previous_tag_name=$($previousRelease.tag_name)" | ConvertFrom-Json
            $generated.body | Set-Content -LiteralPath release-notes.md -Encoding utf8
          }

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git show-ref --tags --verify "refs/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
            if ($tagCommit -ne $env:RELEASE_SHA) {
              throw "Tag $env:RELEASE_TAG exists on a different commit."
            }
            Write-Host "Tag $env:RELEASE_TAG already exists on the release commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG $env:RELEASE_SHA -m $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tag $env:RELEASE_TAG."
          }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push tag $env:RELEASE_TAG."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
            foreach ($asset in $release.assets) {
              gh release delete-asset $env:RELEASE_TAG $asset.name --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to remove old release asset $($asset.name)."
              }
            }

            gh release edit $env:RELEASE_TAG --title $env:RELEASE_TAG --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update release notes for $env:RELEASE_TAG."
            }

            gh release upload $env:RELEASE_TAG poe2-auto-flask.exe LICENSES.txt --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets for $env:RELEASE_TAG."
            }
          } else {
            gh release create $env:RELEASE_TAG poe2-auto-flask.exe LICENSES.txt --verify-tag --title $env:RELEASE_TAG --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG."
            }
          }
