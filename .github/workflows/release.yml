name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.8.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Verify release source and version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags

          main=$(git rev-parse origin/main)

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Manual release version must use MAJOR.MINOR.PATCH format; got '$version'." >&2
              exit 1
            fi
            tag="v$version"

            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              commit=$(git rev-list -n 1 "$tag")
              if ! git merge-base --is-ancestor "$commit" origin/main; then
                echo "Existing tag $tag is not contained in main." >&2
                exit 1
              fi
              git checkout --detach "$commit"
            else
              commit=$(git rev-parse HEAD)
              if [[ "$commit" != "$main" ]]; then
                echo "New manual releases must build the current main commit." >&2
                exit 1
              fi
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Release tag must use vMAJOR.MINOR.PATCH format; got '$tag'." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            commit=$(git rev-parse HEAD)

            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "Release tag must point to a commit contained in main." >&2
              exit 1
            fi
          fi

          root_version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )
          launcher_version=$(python3 - <<'PY'
          import tomllib
          with open("linux-launcher/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )

          if [[ "$root_version" != "$version" ]]; then
            echo "Release version $version does not match Cargo.toml version $root_version." >&2
            exit 1
          fi
          if [[ "$launcher_version" != "$version" ]]; then
            echo "Release version $version does not match linux-launcher/Cargo.toml version $launcher_version." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

  windows-x64:
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Windows Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app-ui -> target

      - name: Backend formatting
        run: cargo fmt --all -- --check

      - name: UI formatting
        run: cargo fmt --manifest-path app-ui/Cargo.toml -- --check

      - name: Backend Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: UI Clippy
        run: cargo clippy --locked --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Backend tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: UI tests
        run: cargo test --locked --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --locked --release --manifest-path app-ui/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package Windows application
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: dist/
          if-no-files-found: error

  linux-launcher:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Cache launcher Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "linux-launcher -> target"

      - name: Check formatting
        working-directory: linux-launcher
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: linux-launcher
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: linux-launcher
        run: cargo test --locked

      - name: Test desktop launch routing
        run: python3 scripts/test-app-run.py

      - name: Build release
        working-directory: linux-launcher
        run: cargo build --locked --release

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-launcher
          path: linux-launcher/target/release/poe2-auto-flask-linux-launcher
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-latest
    needs: [prepare, windows-x64, linux-launcher]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Windows application
        uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: windows-artifact

      - name: Download Linux launcher
        uses: actions/download-artifact@v8
        with:
          name: release-linux-launcher
          path: linux-artifact

      - name: Package AppImage
        run: |
          bash scripts/package-appimage.sh windows-artifact \
            linux-artifact/poe2-auto-flask-linux-launcher \
            dist/poe2-auto-flask-x86_64.AppImage

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-appimage
          path: dist/poe2-auto-flask-x86_64.AppImage
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, windows-x64, linux-appimage]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: release-dist

      - name: Download Linux release asset
        uses: actions/download-artifact@v8
        with:
          name: release-linux-appimage
          path: release-dist

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft == false and .tag_name != \"$RELEASE_TAG\") | [.published_at, .tag_name] | @tsv" \
            | sort -r \
            | head -n 1 \
            | cut -f2 || true)

          if [[ -z "$previous_tag" ]]; then
            cat > release-notes.md <<'EOF'
          Initial public release.

          - Automatic Life and Mana flask use with configurable thresholds
          - Reads PoE2 flask bindings automatically
          - Windows x64 executable and Linux x86-64 AppImage
          EOF
          else
            release_pr_body=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .body // ""')

            if [[ -n "$release_pr_body" ]]; then
              first_line=$(printf '%s\n' "$release_pr_body" | head -n 1)
              if [[ "$first_line" == "Prepare $RELEASE_TAG." ]]; then
                release_pr_body=$(printf '%s\n' "$release_pr_body" | tail -n +2 | sed '/./,$!d')
              fi

              {
                echo '## Highlights'
                echo
                printf '%s\n' "$release_pr_body"
                echo
                printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                  "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
              } > release-notes.md
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f "tag_name=$RELEASE_TAG" \
                -f "target_commitish=$RELEASE_SHA" \
                -f "previous_tag_name=$previous_tag" \
                --jq '.body' > release-notes.md
            fi
          fi

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags

          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
              echo "Tag $RELEASE_TAG exists on a different commit." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists on the release commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          assets=(
            release-dist/poe2-auto-flask-windows-x64.exe
            release-dist/poe2-auto-flask-x86_64.AppImage
            release-dist/LICENSES.txt
          )

          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                done

            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
